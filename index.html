<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>snek</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <!-- INTRO -->
    <div id="enter-screen">
        <video
            id="enter-video"
            autoplay
            muted
            playsinline
            preload="auto"
        >
            <source src="/assets/graphics/v/enter-screen.mp4" type="video/mp4">
        </video>

        <div class="enter-overlay">
            <img
                src="/assets/graphics/i/logo.png"
                alt="snek"
                class="enter-logo"
            >

            <button id="enter-button">
                ENTER
            </button>
        </div>
    </div>


    <!-- MAIN SITE -->
    <main id="site">

        <nav class="topbar">

            <a href="/" class="brand">
                <img src="/assets/graphics/i/logo.png" alt="snek">
            </a>

            <div class="nav-links">
                <a href="#games">games</a>
                <a href="#apps">apps</a>
                <a href="#about">about</a>
            </div>

        </nav>


        <section class="hero">

            <div class="hero-content">

                <p class="eyebrow">WELCOME TO</p>

                <img
                    src="/assets/graphics/i/logo.png"
                    alt="snek"
                    class="hero-logo"
                >

                <p class="hero-description">
                    a focused place for games, apps, and more.
                </p>

                <div class="hero-actions">
                    <a href="#games" class="button primary">
                        games
                    </a>

                    <a href="#apps" class="button">
                        apps
                    </a>
                </div>

            </div>

        </section>


        <section id="games" class="section">

            <div class="section-heading">
                <span>01</span>
                <h2>games</h2>
            </div>

            <div class="empty-card">
                <p>games are coming soon.</p>
            </div>

        </section>


        <section id="apps" class="section">

            <div class="section-heading">
                <span>02</span>
                <h2>apps</h2>
            </div>

            <div class="empty-card">
                <p>apps are coming soon.</p>
            </div>

        </section>


        <section id="about" class="section about">

            <div class="section-heading">
                <span>03</span>
                <h2>about</h2>
            </div>

            <p>
                snek is a focused web project built to stay simple,
                organized, and fast.
            </p>

        </section>


        <footer>
            <span>🐍 snek</span>
            <span>built by solar / u-spe</span>
        </footer>

    </main>

    <script src="/js/main.js"></script>

</body>
</html>
