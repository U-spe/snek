<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>snek</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="/assets/graphics/i/logo.png">

  <link
    href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css"
    rel="stylesheet"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@300;400;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/css/index.css">
</head>

<body data-bg-style="stars">

  <!-- =========================
       ENTER SCREEN
  ========================== -->

  <div id="loading-screen">

    <video
      id="loadVideo"
      src="/assets/graphics/v/enter-screen.mp4"
      autoplay
      muted
      playsinline
    ></video>

    <div class="loading-overlay"></div>

    <div class="enter-content">
      <img
        src="/assets/graphics/i/logo.png"
        class="enter-logo"
        alt="snek"
      >

      <button id="enter-btn">
        ENTER
      </button>
    </div>

  </div>


  <!-- =========================
       BACKGROUND
  ========================== -->

  <div id="bg-effects-container">
    <canvas id="stars-canvas"></canvas>
    <div id="fog-overlay"></div>
  </div>


  <!-- =========================
       APP
  ========================== -->

  <div id="app">

    <!-- CLOCK -->
    <div class="top">
      <div id="time">--:--</div>
      <div id="date">loading...</div>
    </div>


    <!-- MENU -->
    <div class="menu-wrapper">

      <button id="menu-btn" aria-label="Open menu">
        <i class="ri-menu-line"></i>
      </button>

      <div id="menu">

        <button onclick="go('#games')">
          <i class="ri-gamepad-line"></i>
          games
        </button>

        <button onclick="go('#games')">
          <i class="ri-links-line"></i>
          backup urls
        </button>

        <button onclick="location.reload()">
          <i class="ri-refresh-line"></i>
          reload
        </button>

      </div>

    </div>


    <!-- HERO -->
    <div class="center">

      <div class="hero-wrap">

        <img
          src="/assets/graphics/i/logo.png"
          class="logo-img"
          alt="snek logo"
        >

        <div class="hero-text">

          <h1>snek</h1>

          <div class="const" id="constText">
            backup mode: activated
          </div>

        </div>

      </div>

    </div>


    <!-- GAME / BACKUP BUTTONS -->
    <div class="games" id="games">

      <button
        class="game-card"
        onclick="window.location.href='https://dns2.webcreationstudios.org'"
      >
        backup url #1
      </button>

      <button
        class="game-card"
        onclick="window.location.href='https://madeby.thegoat.webcreationstudios.org'"
      >
        backup url #2
      </button>

      <button
        class="game-card"
        onclick="window.location.href='https://dns1.mjevents.org'"
      >
        backup url #3
      </button>

      <button
        class="game-card"
        onclick="window.location.href='https://madeby.thegoat.mjevents.org'"
      >
        backup url #4
      </button>

    </div>

  </div>

  <script src="/js/globalmenu.js"></script>
  <script src="/js/index.js"></script>
  <script scr="/js/global.js"></script>

</body>
</html>
