<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>snek</title>

    <link rel="icon" type="image/png" href="/assets/graphics/i/logo.png">
    <link rel="stylesheet" href="/css/index.css">
</head>

<body>

    <!-- ENTER SCREEN -->
    <div id="enter-screen">
        <video
            id="enter-video"
            src="/assets/graphics/v/enter-screen.mp4"
            autoplay
            muted
            playsinline
            loop
        ></video>

        <div class="enter-overlay"></div>

        <div class="enter-content">
            <img
                class="enter-logo"
                src="/assets/graphics/i/logo.png"
                alt="snek"
            >

            <button id="enter-button" type="button">
                ENTER
            </button>
        </div>
    </div>


    <!-- MAIN SITE -->
    <main id="site" class="hidden">

        <!-- TOP BAR -->
        <header class="topbar">

            <div class="brand">
                <img
                    src="/assets/graphics/i/logo.png"
                    alt="snek"
                >

                <span>snek</span>
            </div>

            <div class="topbar-center">
                <div class="search">
                    <span class="search-icon">⌕</span>

                    <input
                        id="game-search"
                        type="text"
                        autocomplete="off"
                        placeholder="search games..."
                    >
                </div>
            </div>

            <nav class="nav">
                <a href="#games">games</a>
            </nav>

        </header>


        <!-- HERO / GAME HUB -->
        <section class="hero">

            <div class="hero-content">
                <div class="eyebrow">
                    <span class="status-dot"></span>
                    snek
                </div>

                <h1>games.</h1>

                <p>
                    your games. one place.
                </p>
            </div>

        </section>


        <!-- GAMES -->
        <section id="games" class="games-section">

            <div class="section-heading">
                <div>
                    <span class="section-label">library</span>
                    <h2>games</h2>
                </div>

                <span id="game-count">0 games</span>
            </div>

            <div id="games-grid" class="games-grid">

                <!-- Example cards.
                     Replace/add these with your actual UBG games. -->

                <a
                    class="game-card"
                    href="#"
                    data-name="game"
                >
                    <div class="game-image">
                        <div class="image-placeholder">
                            SNEK
                        </div>

                        <div class="play-button">
                            ▶
                        </div>
                    </div>

                    <div class="game-info">
                        <span class="game-title">game</span>
                        <span class="game-meta">play</span>
                    </div>
                </a>

            </div>

            <div id="no-results" class="no-results hidden">
                <span>no games found.</span>
            </div>

        </section>


        <!-- SIMPLE FOOTER -->
        <footer>
            <span>snek</span>
            <span>built for games.</span>
        </footer>

    </main>

    <script src="/js/index.js"></script>
</body>
</html>
